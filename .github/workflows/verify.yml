name: Verify & Deploy
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  check-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          if [[ ! -f index.html ]]; then
            echo "❌ index.html is missing!"
            exit 1
          fi
          echo "✅ index.html is present and valid for Pages deployment."
